
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Santhosh-git26/my-agrocd.git
    targetRevision: good
    path: redis

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
