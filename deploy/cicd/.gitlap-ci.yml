stages:
  - lint
  - test
  - build
  - deploy

lint:
  stage: lint
  image: python:3.12
  script:
    - pip install black flake8
    - black --check .
    - flake8 .
  tags:
    - docker

test:
  stage: test
  image: python:3.12
  services:
    - name: docker:24.0-dind  # For potential Docker-in-Docker if expanding
  script:
    - pip install -r requirements.txt
    - pytest tests/ -v
  tags:
    - docker

build:
  stage: build
  image: python:3.12
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $CI_REGISTRY_IMAGE/flask-app:$CI_COMMIT_SHA .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/flask-app:$CI_COMMIT_SHA
  tags:
    - docker

deploy-k8s:
  stage: deploy
  image: bitnami/kubectl:1.30
  before_script:
    - apk add --no-cache docker-cli
    - kind get kubeconfig --name cicd-demo > /root/.kube/config
  script:
    - sed -i "s|YOUR_USERNAME|$CI_PROJECT_PATH|g" k8s/deployment.yaml
    - kubectl apply -f k8s/
    - kubectl rollout status deployment/flask-app
    - kubectl port-forward service/flask-service 8080:80 &
    - sleep 5
    - curl -f http://localhost:8080/
  only:
    - main
  tags:
    - docker
